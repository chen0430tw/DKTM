executor:
  mode: real-run
  auto_reboot: false
  transition_method: auto
  fallback_method: winre
  marker_path: "C:\\dktm_transition.marker"
  # winpe_entry_ids: leave empty to auto-discover from BCD at runtime.
  # Priority order if discovered: DKTM clean WinPE -> WinRE (machine-specific GUID).
  # To override, list explicit GUIDs here.
  winpe_entry_ids: []
